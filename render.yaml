services:
  - type: web
    name: SmartERP
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build && npm run prepare-demo
    startCommand: npm run demo:host
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.23.3
      - key: MONGOMS_DOWNLOAD_DIR
        value: /opt/render/project/src/.cache/mongodb
